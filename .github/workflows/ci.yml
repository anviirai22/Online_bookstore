name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/online_bookstore_ci
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/online_bookstore_ci_test
      JWT_SECRET: ci-only-secret-that-is-long-enough
      CLIENT_ORIGIN: http://localhost:5173
      COOKIE_SECURE: false
      PAYMENT_ADAPTER: sandbox
      PAYMENT_SANDBOX_MODE: success
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Build client
        run: npm run build
      - name: Unit and integration tests
        run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:e2e
